services:

  nginx:
    container_name: nginx
    build: ./requirements/nginx/
    ports:
      - 443:443
    networks: 
      - inception
    restart: always
    volumes:
      - "wordpress_data:/var/www/html"
    depends_on:
      mariadb:
        condition: service_healthy
      wordpress:
        condition: service_healthy

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb/
    networks: 
      - inception
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - "mariadb_data:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
      start_period: 5s
      timeout: 5s

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress/
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    restart: always
    volumes:
      - "wordpress_data:/var/www/html"
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DOMAIN_NAME: ${DOMAIN_NAME}
      SITE_TITLE: ${SITE_TITLE}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      USER_LOGIN: ${USER_LOGIN}
      USER_PASSWORD: ${USER_PASSWORD}
      USER_EMAIL: ${USER_EMAIL}
    healthcheck:
      test: ["CMD", "cgi-fcgi", "-bind", "-connect", "localhost:9000"]
      interval: 5s
      retries: 10
      start_period: 5s
      timeout: 5s

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/halnuma/data/db
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/halnuma/data/wordpress